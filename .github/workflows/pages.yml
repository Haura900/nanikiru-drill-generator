name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: python -m pip install pytest
      - run: npx playwright install --with-deps chromium
      - run: node --check docs/app.js
      - run: node --check docs/firebase-sync.js
      - run: npm test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        shell: bash
        run: |
          short_sha="$(git rev-parse --short=7 HEAD)"
          build_date="$(date -u +%Y.%m.%d)"
          printf 'window.NANIKIRU_BUILD_VERSION = "v%s-%s";\n' "$build_date" "$short_sha" > docs/version.js
          sed -E -i "s/v=[0-9]{8}-[0-9]+/v=${short_sha}/g" docs/index.html docs/firebase-sync.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
